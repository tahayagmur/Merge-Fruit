<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beceri Defteri</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2f2a5a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Beceri Defteri"><meta name="description" content="5 dakikalık beceri dersleri ve 7 günlük önce/sonra ölçümü.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f2a5a'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ff6b5a'/%3E%3Ccircle cx='27' cy='27' r='6' fill='%23ffb38a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, şefkatli ama ölçen; vaadi test eden bir deney defteri
   IDEA: cep defteri + laboratuvar defteri — her ders bir araç, her araç ölçülür
   PICTURE: çalışan uygulamanın kendisi; nefes küresi, sayaç halkası, taahhüt kartı
   COLOUR and TYPE: alacakaranlık moru zemin bandı, kayısı + mercan vurgu; Fraunces + Inter
   LAYOUT: tek kolon, 640px, telefon öncelikli */
:root{color-scheme:light dark;--bg:light-dark(#f6f5fb,#12101d);--card:light-dark(#fff,#1d1a2e);--ink:light-dark(#1d1a33,#eeeaf7);--mute:light-dark(#625d7a,#a9a3c2);--line:light-dark(#e3e0ee,#2e2a45);--band:light-dark(#2f2a5a,#221d40);--apr:#ffb38a;--cor:#ff6b5a;--soft:light-dark(#f1ecff,#2a2446)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;line-height:1.08;text-wrap:balance;margin:0 0 .45em}
h1{font-size:clamp(30px,6vw,44px)}h2{font-size:clamp(23px,4.5vw,30px)}h3{font-size:19px;margin:0 0 .2em}
p{margin:0 0 1em}
header{background:var(--band);color:#fff;padding:14px max(4vw,16px) 0}
.top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:auto}
.brand{font-family:Fraunces,serif;font-size:20px}.brand b{color:var(--apr);font-weight:650}
.streak{font-size:14px;opacity:.85}
nav{display:flex;gap:2px;max-width:640px;margin:8px auto 0;overflow-x:auto}
nav button{flex:none;background:none;border:0;color:#cfc8ee;font:500 15px Inter,sans-serif;padding:12px 14px;min-height:44px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:var(--apr)}
main{max-width:640px;margin:auto;padding:24px max(4vw,16px) 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--cor);color:#fff;font:600 16px Inter,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--apr);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;font:16px Inter,sans-serif;cursor:pointer;min-height:52px}
.opt.on{border-color:var(--cor);background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips .opt{width:auto;margin:0;padding:10px 12px;min-height:44px;font-size:14px}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:16px Inter,sans-serif;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}.bar i{display:block;height:100%;background:var(--cor);transition:width .3s}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--soft)}
.lesson{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.grow{flex:1 1 200px}
.faded{opacity:.5}
.big{font-family:Fraunces,serif;font-size:clamp(40px,10vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.ring{display:grid;place-items:center;margin:20px auto;width:220px;height:220px;border-radius:50%;background:conic-gradient(var(--cor) var(--p,0%),var(--line) 0)}
.ring>div{width:188px;height:188px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.orbbox{height:240px;display:grid;place-items:center}
.orb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe0cf,var(--apr) 45%,var(--cor));box-shadow:0 24px 50px -12px rgba(255,107,90,.55);transform:scale(.6);transition:transform 1s ease-in-out}
.blab{text-align:center;font-family:Fraunces,serif;font-size:22px;min-height:1.4em}
.commit{background:var(--band);color:#fff;border-radius:18px;padding:22px;font-family:Fraunces,serif;font-size:20px;line-height:1.38}
.range{width:100%;accent-color:var(--cor);height:44px}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.meter{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.2em;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.meter .tr{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.meter .tr i{display:block;height:100%;border-radius:6px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats .card{margin:0;padding:14px}.stats b{display:block;font-family:Fraunces,serif;font-size:28px;line-height:1.1}
.verdict{border-left:5px solid var(--cor)}
.foot{margin-top:28px;font-size:13px;color:var(--mute)}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.orb,.bar i{transition:none!important}}
</style></head><body>
<header><div class="top"><div class="brand">beceri<b>defteri</b></div><div class="streak" id="streak"></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
{
const TR={erteleme:{n:'Erteleme',c:'#ff6b5a'},stres:{n:'Stres',c:'#8f7cf5'},enerji:{n:'Düşük enerji',c:'#f2b33d'},tepki:{n:'Tepkisellik',c:'#e35d9c'},toparlanma:{n:'Toparlanma',c:'#3fb6a8'}};
const KEYS=Object.keys(TR);
const T=(h,p)=>({t:'text',h,p}),I=(h,p,f)=>({t:'input',h,p,f}),C=(h,id,o,p)=>({t:'choice',h,id,o,p}),TM=(h,p,sec)=>({t:'timer',h,p,sec}),B=(h,p,ph,cyc)=>({t:'breath',h,p,ph,cyc}),K=tpl=>({t:'commit',tpl});
const BOX=[['Nefes al',4,1],['Tut',4,1],['Ver',4,.6],['Tut',4,.6]];
const SIGH=[['Burnundan derin al',2,.9],['Bir küçük nefes daha',1,1],['Ağzından yavaşça ver',6,.55]];
const L=[
{id:'e1',k:'erteleme',ti:'Erteleme bir zaman sorunu değil',tool:'Duyguyu bul',s:[
 T('Asıl mesele duygu','Ertelediğin iş içinde rahatsız edici bir duygu tetikliyor. Ertelemek o duygudan anlık kaçış. Araştırmacılar buna “kısa vadeli duygu onarımı” diyor: şimdi rahatlarsın, yarın bedelini ödersin.'),
 I('Bir iş seç','Bugün ya da bu hafta ertelediğin tek bir iş.',[['task','Ertelediğim iş','Vergi evraklarını toplamak']]),
 C('Bu işi düşününce en çok ne hissediyorsun?','feel',[['Sıkılıyorum','sıkıntı'],['Nereden başlayacağımı bilmiyorum','belirsizlik'],['Kötü yapmaktan korkuyorum','başarısızlık korkusu'],['Bunalıyorum, çok büyük','bunalmışlık'],['İçimden gelmiyor, içerliyorum','isteksizlik']]),
 T('Adını koy','“Tembelim” demek çözüm üretmez. “Bu iş bende {feel} uyandırıyor” demek üretir. Sıkıntının çözümü işi kısa tutmak, belirsizliğin çözümü ilk adımı netleştirmek, korkunun çözümü çıtayı indirmek, bunalmışlığın çözümü bölmek.'),
 K('“{task}” işini erteleme sebebim tembellik değil, {feel}. Bugün ona sadece 2 dakika bakacağım.')]},
{id:'e2',k:'erteleme',ti:'En küçük ilk adım',tool:'2 dakika kapısı',s:[
 T('Başlamak işin en zor kısmı','Beyin büyük ve belirsiz bir görevi tehdit gibi algılar. Görevi o kadar küçültürsün ki tehdit ortadan kalkar: ilk adım 2 dakikadan kısa ve fiziksel olmalı.'),
 I('İlk adımı tanımla','',[['task','İş','Sunumu hazırlamak'],['step','2 dakikadan kısa, fiziksel ilk hareket','Dosyayı açıp başlık sayfasını yazmak']]),
 T('Kural','Sadece 2 dakika. Sonra bırakmakta özgürsün. Çoğu zaman bırakmazsın, çünkü zor olan başlamaktı. Bırakırsan da kazandın: iş artık “başlanmış iş”.'),
 TM('Şimdi yap','{step}',120),
 C('Süre bitince ne oldu?','res',['Devam ettim','Bıraktım ama başlamış oldum','Başlayamadım']),
 K('“{task}” için ilk adım her zaman: {step}. 2 dakika, sonra serbestim.')]},
{id:'e3',k:'erteleme',ti:'Eğer–o zaman planı',tool:'Uygulama niyeti',s:[
 T('Niyet yetmez, bağlantı kur','“Yarın yaparım” bir dilektir. “Kahvemi masaya koyduğumda ilk paragrafı yazacağım” bir plandır. Gollwitzer’in uygulama niyetleri üzerine çalışmaları, ne zaman–nerede–ne sorularını önceden bağlamanın hedefe ulaşmayı anlamlı biçimde artırdığını gösteriyor.'),
 I('Planını kur','Tetikleyici somut bir an ya da yer olmalı.',[['when','Eğer… (an, yer)','sabah kahvemi masaya koyduğumda'],['then','O zaman… (küçük eylem)','raporun ilk paragrafını yazacağım']]),
 I('Engeli de planla','',[['obs','En olası engel','telefonu elime almak'],['fix','O engel gelirse ne yapacaksın?','telefonu diğer odaya koyacağım']]),
 K('Eğer {when}, o zaman {then}. Eğer {obs} olursa, {fix}.')]},
{id:'e4',k:'erteleme',ti:'Bilerek kötü ilk taslak',tool:'Yeterince iyi çizgisi',s:[
 T('Çıta başlamayı engelliyor','Mükemmeliyetçilikte standart o kadar yüksektir ki başlamak bile başarısızlık riski taşır. Çözüm standardı yazıya dökmek ve bilinçli olarak indirmek.'),
 I('Çizgiyi çek','',[['task','İş','Teklif metni'],['ok','Bu işin “yeterince iyi” hali neye benziyor?','Fiyat, kapsam ve takvim yazılı; yazım hatası yok',1]]),
 T('İlk versiyonun görevi','İlk versiyonun görevi iyi olmak değil, var olmak. Kötü bir taslağı düzeltmek, boş sayfadan çok daha kolaydır.'),
 TM('5 dakika: kalite yok, sadece hacim','Bilerek kötü bir ilk taslak üret. Silme, düzeltme yok.',300),
 K('“{task}” için çıta: {ok}. İlk taslak kötü olabilir, işi bu.')]},
{id:'e5',k:'erteleme',ti:'Kendini affet, sonra başla',tool:'Öz-şefkat',s:[
 T('Kendine yüklenmek ters teper','Suçluluk motivasyon gibi hissettirir ama işi daha da itici yapar. Bir üniversite çalışmasında, ilk sınava çalışırken ertelediği için kendini affeden öğrencilerin ikinci sınavda daha az ertelediği görüldü (Wohl ve ark., 2010).'),
 I('Arkadaşına ne derdin?','Aynı işi erteleyen yakın bir arkadaşın sana dert yansa…',[['fr','Ona ne derdin?','Herkesin başına gelir, şimdi küçük bir yerden başla',1]]),
 I('Şimdi kendine','Aynı tonu, aynı nezaketi kullan.',[['self','Kendine yaz','',1]]),
 K('{self}')]},
{id:'s1',k:'stres',ti:'Sinir sistemini 60 saniyede yavaşlat',tool:'Fizyolojik iç çekiş',s:[
 T('Nefes verme fren gibi çalışır','Uzun bir nefes verme, kalp ritmini yavaşlatan sistemi devreye sokar. Küçük bir çalışmada günde 5 dakika bu teknik, ruh halinde farkındalık meditasyonundan daha fazla iyileşmeyle ilişkili bulundu (Balban ve ark., 2023).'),
 B('5 tur yap','İki kısa alış, bir uzun veriş. Küreyi takip et.',SIGH,5),
 C('Şimdi bedenin nasıl?','body',['Daha yavaş','Aynı','Daha gergin']),
 K('Gerildiğimde: burnumdan iki kısa nefes, ağzımdan bir uzun veriş. 5 tur.')]},
{id:'s2',k:'stres',ti:'Kontrol çemberi',tool:'Ayır ve odaklan',s:[
 T('Stresin yakıtı','Kontrol edemediğin şeye harcanan dikkat sonuç üretmez, stres üretir. İlk iş, ikisini ayırmak.'),
 I('Kafandakiler','',[['wor','Şu an zihnini meşgul eden en büyük şey','Müşteri teklifimize dönmedi',1]]),
 I('Ayır','',[['no','Bunun kontrolünde olmayan kısmı','Ne zaman ve ne karar verecekleri'],['yes','Kontrolünde olan kısmı','Takip mailini atmak, B planı hazırlamak']]),
 I('Tek adım','',[['act','Kontrolündeki kısım için bugün tek bir adım','Saat 14’te kısa bir takip maili']]),
 K('{no} benim elimde değil. Elimde olan: {act}.')]},
{id:'s3',k:'stres',ti:'Endişe saati',tool:'Endişeyi ertele',s:[
 T('Endişeyi bastırma, randevu ver','Endişeyi bastırmaya çalışmak onu güçlendirir. Onun yerine güne sabit, kısa bir endişe saati koyarsın. Gün içinde endişe gelince not alıp o saate ertelersin. Borkovec’in endişe erteleme çalışmalarından gelen bir teknik.'),
 I('Randevunu belirle','',[['wt','Yarın için 15 dakikalık endişe saatin','18:30, balkonda']]),
 I('İlk kaydı yap','',[['wn','Şu an aklındaki endişe','',1]]),
 T('Gün içinde','Endişe geldiğinde kendine şunu söyle: “Bunu not ettim, {wt} saatinde düşüneceğim.” Sonra önündeki işe dön. Endişe saati gelince listeye bak; çoğunun önemini yitirdiğini göreceksin.'),
 K('Endişelerim için randevum var: {wt}. O saate kadar not alır, ertelerim.')]},
{id:'n1',k:'enerji',ti:'Önce hareket, sonra motivasyon',tool:'Davranışsal aktivasyon',s:[
 T('Sıra tersine','“Enerjim gelince yaparım” beklemesi genelde hiç gelmez. Davranışsal aktivasyonun temel fikri: eylem enerjiyi ve ruh halini getirir, tersi değil.'),
 I('Küçük listeyi yap','10 dakikanın altında, keyif ya da başarı hissi veren şeyler.',[['acts','3 küçük şey','Kısa yürüyüş, masayı toplamak, bir arkadaşa mesaj',1]]),
 I('Takvime koy','',[['pick','Bugün hangisini, saat kaçta?','17:00’de 10 dakika yürüyüş']]),
 K('Enerji beklemeyeceğim. Bugün: {pick}.')]},
{id:'n2',k:'enerji',ti:'Enerji muhasebesi',tool:'Emen ve dolduran',s:[
 T('Enerji bir bütçe','Gün içinde bazı şeyler enerjini emer, bazıları doldurur. Çoğu insan emicileri bilir, dolduranları unutur.'),
 I('Hesabı çıkar','',[['dr','Bugün enerjini emen 3 şey','Uzun toplantı, öğleden sonra şekerli atıştırmalık, gece ekran',1],['fi','Enerjini dolduran 3 şey','Gün ışığı, kısa yürüyüş, sevdiğim biriyle konuşma',1]]),
 I('Tek değişiklik','',[['sw','Yarın bir emiciyi azaltıp bir doldurucu eklemek için tek değişiklik','Toplantıdan sonra 5 dakika dışarı çıkmak']]),
 K('Yarınki enerji hamlem: {sw}.')]},
{id:'n3',k:'enerji',ti:'5 dakikalık şarj',tool:'Hareket molası',s:[
 T('Yorgunken hareket mi?','Zihinsel yorgunlukta kısa bir yürüyüş ya da hafif hareket, enerji hissini kahveden daha temiz biçimde artırabilir. Kural: ekran yok.'),
 TM('Kalk','Yürü, merdiven çık, esne, pencereden dışarı bak. Telefona bakma.',300),
 C('Şimdi enerjin?','en',['Arttı','Aynı','Düştü']),
 K('Öğleden sonra düşüşünde: 5 dakika ekransız hareket.')]},
{id:'t1',k:'tepki',ti:'Tepki vermeden önce DUR',tool:'DUR–NEFES–GÖZLE–SEÇ',s:[
 T('Uyaran ile tepki arasında boşluk','Ani tepki, düşünmeden önce bedenin verdiği bir karardır. Amaç o boşluğu birkaç saniye büyütmek: Dur, bir nefes al, ne olduğunu gözle, sonra bilerek seç.'),
 I('Tetikleyicini tanı','',[['trig','Seni en hızlı ateşleyen durum','Toplantıda sözümün kesilmesi'],['cue','O an DUR’u hatırlatacak fiziksel işaret','Kalemi masaya bırakmak']]),
 B('Provası','Tetikleyiciyi hayal et, sonra 3 kutu nefes al.',BOX,3),
 K('{trig} olduğunda: {cue}, bir nefes, sonra seçerim.')]},
{id:'t2',k:'tepki',ti:'Duyguyu adlandır',tool:'Duygu etiketleme',s:[
 T('Kelime fren işlevi görür','Bir duyguyu kelimeye dökmek, beynin alarm merkezinin tepkisini azaltıyor (Lieberman ve ark., 2007). Ne kadar kesin kelime, o kadar etkili.'),
 I('Son tepkini hatırla','',[['ev','Ne oldu?','Eşim plan değiştirdi, sert cevap verdim']]),
 I('Altındaki duygular','Öfke çoğu zaman üst katmandır. Altında ne vardı? 2–3 kelime.',[['em','O an hissettiklerim','yorgun, değersizleşmiş, kontrolü kaybetmiş']]),
 T('Fark ettin mi?','Öfke yerine “{em}” dediğinde, verebileceğin tepkilerin listesi genişler. Yorgunluğa uyku, değersizleşmeye konuşma iyi gelir; öfkeye ise genelde hiçbir şey.'),
 K('O an hissettiğim: {em}. Adını koyunca seçme şansım geri gelir.')]},
{id:'t3',k:'tepki',ti:'Düşünceye mesafe',tool:'Ayrışma (ACT)',s:[
 T('Düşünce bir gerçek değil','Kabul ve Kararlılık Terapisi’nin (ACT) bir aracı: düşünceyle aranı açmak. Düşünceyi silmeye çalışmazsın, sadece onun içinden değil, dışından bakarsın.'),
 I('Yapışkan bir düşünce','',[['th','Seni tetikleyen düşünce','Beni hiç dinlemiyor']]),
 T('Şimdi oku','“Şu düşünceye sahip olduğumu fark ediyorum: {th}.” Aynı cümle, ama artık sen düşünce değilsin, düşünceyi gözleyen kişisin.'),
 C('Düşünce şimdi ne kadar yapışkan?','st',['Daha az','Aynı','Daha fazla']),
 K('Şu düşünceye sahip olduğumu fark ediyorum: {th}.')]},
{id:'r1',k:'toparlanma',ti:'Aksiliği yeniden anlat',tool:'3K testi',s:[
 T('Hikaye toparlanmayı belirler','Seligman’ın açıklama tarzı araştırmaları: bir aksiliği kişisel (tamamen benim suçum), kalıcı (hep böyle olacak) ve kapsamlı (her şeyi mahvetti) diye anlatanlar daha zor toparlanıyor.'),
 I('Ne oldu?','',[['ev','Yakın zamandaki bir aksilik','Başvurum reddedildi'],['story','Kendine ne söyledin?','Yeterince iyi değilim, hiçbir zaman olmayacak',1]]),
 I('3K testi','',[['k1','Kişisel: tamamen senin suçun mu? Başka etkenler?','Çok başvuru vardı, kriterleri bilmiyordum'],['k2','Kalıcı: hep böyle mi kalacak?','Hayır, bir sonraki başvuru farklı'],['k3','Kapsamlı: hayatının her alanını mı etkiliyor?','Hayır, sadece bu başvuruyu']]),
 I('Daha doğru versiyon','',[['nw','Hikayeyi yeniden yaz','',1]]),
 K('{nw}')]},
{id:'r2',k:'toparlanma',ti:'Öz-şefkat molası',tool:'Üç cümle',s:[
 T('Kristin Neff’in üç adımı','1) Farkındalık: “Bu zor bir an.” 2) Ortak insanlık: “Zorluk yaşamak insan olmanın parçası, yalnız değilim.” 3) Nezaket: “Şu an kendime nazik olayım.”'),
 B('Önce nefes','Elini göğsüne koy, 3 kutu nefes al.',BOX,3),
 I('Kendi cümlen','Üçüncü adımı kendine göre kur.',[['kind','Şu an kendime ihtiyacım olanı vereyim:','Bugün yeterince yaptım, dinlenmeyi hak ediyorum']]),
 K('Bu zor bir an. Zorluk insan olmanın parçası. {kind}')]},
{id:'r3',k:'toparlanma',ti:'Değer pusulası',tool:'Değerler (ACT)',s:[
 T('Hedef biter, değer bitmez','Bir hedefte başarısız olabilirsin, ama bir değere doğru her gün yeniden adım atabilirsin. Aksilikten sonra pusulayı hedefe değil değere ayarlarsın.'),
 C('Şu an senin için en önemli değer hangisi?','val',['Gelişim','Aile','Dürüstlük','Üretmek','Özgürlük','Sağlık','Yardım etmek','Cesaret']),
 I('Neden?','',[['why','Bu değer senin için neden önemli?','',1]]),
 I('Bu hafta','',[['act','Bu değere doğru tek küçük adım','Oğlumla bir akşam ekransız proje']]),
 K('Pusulam: {val}. Bu haftaki adımım: {act}.')]}
];
const LB=Object.fromEntries(L.map(l=>[l.id,l]));
const PICK=[
 {q:'Şu an en çok ne zorluyor?',o:[['Başlamak, bitirmek, ertelemek',{erteleme:3}],['Zihnimin hiç susmaması, gerginlik',{stres:3}],['Sürekli yorgun ve isteksiz olmak',{enerji:3}],['Sonradan pişman olduğum tepkiler',{tepki:3}],['Aksiliklerden sonra toparlanamamak',{toparlanma:3}]]},
 {q:'Bir işi ertelediğinde aklından en çok ne geçiyor?',o:[['Nereden başlayacağımı bilmiyorum',{erteleme:2}],['Mükemmel olmayacaksa hiç yapmayayım',{erteleme:2,toparlanma:1}],['Yorgunum, sonra yaparım',{enerji:2}],['Düşündükçe içim daralıyor',{stres:2}]]},
 {q:'Zor bir an geldiğinde ilk ne oluyor?',o:[['Hemen tepki veriyorum',{tepki:2}],['Kafamda dönüp duruyor',{stres:2}],['Kendimi suçluyorum',{toparlanma:2}],['Telefona kaçıyorum',{erteleme:1,enerji:1}]]},
 {q:'Gün sonunda en sık hangisini hissediyorsun?',o:[['Yapmadıklarım için suçluluk',{erteleme:2}],['Bitkinlik',{enerji:2}],['Gerginlik, uykuya dalamamak',{stres:2}],['Birine fazla sert davrandığımı',{tepki:2}],['Hiçbir şeyin yolunda gitmediğini',{toparlanma:2}]]}
];
const BASE=[['erteleme','Önemli işleri son ana kadar erteledim.'],['stres','Zihnim gerginlikten durmadı.'],['enerji','Gün içinde enerjim çabuk tükendi.'],['tepki','Sonradan pişman olduğum tepkiler verdim.'],['toparlanma','Bir aksilikten sonra toparlanmam uzun sürdü.']];
const LIK=['Hiç','Nadiren','Bazen','Sık sık','Neredeyse her gün'];
const TIME=[['5 dakika, günde 1 ders',1],['10 dakika, günde 2 ders',2],['15 dakika, günde 3 ders',3]];
const QZ=[...PICK.map(p=>({t:'pick',...p})),...BASE.map(b=>({t:'base',k:b[0],q:b[1]})),{t:'time',q:'Günde ne kadar zaman ayırabilirsin?'}];

const KEY='beceri-defteri-v1';
const blank=()=>({view:'welcome',quiz:{},sc:null,base:null,re:[],plan:[],perDay:1,done:{},ans:{},commits:{}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U={q:0,lid:null,st:-1,pre:5,post:5,tm:null,bt:null,rt:{},reset:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const daysSince=d=>Math.floor((new Date(today())-new Date(d))/864e5);
const A=lid=>S.ans[lid]||(S.ans[lid]={});
const fill=(tpl,lid,raw)=>tpl.replace(/\{(\w+)\}/g,(m,k)=>{const v=A(lid)[k];return v?(raw?v:'<b>'+esc(v)+'</b>'):'…'});
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>n.toFixed(1).replace('.',',');
function clearT(){clearInterval(U.tm);clearTimeout(U.bt);U.tm=U.bt=null}

function streak(){const days=new Set(Object.values(S.done).map(d=>d.date));let n=0,d=new Date();if(!days.has(today()))d.setDate(d.getDate()-1);while(days.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}

function score(){
 const sc=Object.fromEntries(KEYS.map(k=>[k,0]));
 QZ.forEach((q,i)=>{const a=S.quiz[i];if(a==null)return;if(q.t==='pick')for(const[k,w]of Object.entries(q.o[a][1]))sc[k]+=w;if(q.t==='base')sc[q.k]+=a});
 const ord=[...KEYS].sort((a,b)=>sc[b]-sc[a]);
 const by=k=>L.filter(l=>l.k===k).map(l=>l.id);
 const p=by(ord[0]),s=by(ord[1]),plan=[];
 while(p.length||s.length){plan.push(...p.splice(0,2),...s.splice(0,1))}
 ord.slice(2).forEach(k=>plan.push(...by(k)));
 S.sc=sc;S.ord=ord;S.plan=plan;
 S.base={date:today(),v:Object.fromEntries(BASE.map((b,i)=>[b[0],S.quiz[PICK.length+i]]))};
 S.perDay=TIME[S.quiz[QZ.length-1]][1];
}

function vWelcome(){return `<h1>Bakalım gerçekten işe yarıyor mu?</h1>
<p>Bu, Overwell’in vaat ettiği akışın çalışan bir modeli: kısa bir test, sana göre bir plan ve her biri tek bir araç öğreten 5 dakikalık dersler. CBT, ACT ve öz-şefkat araştırmalarından gelen teknikler.</p>
<div class="card"><h3>Overwell’de olmayan bir şey ekledim: ölçüm</h3><p class="mute" style="margin:0">Başta 5 soruluk bir taban ölçüm alınır. Her derste önce/sonra puan, ertesi gün “uyguladın mı?” sorusu gelir. 7. günde aynı 5 soruyu tekrar cevaplarsın ve işe yarayıp yaramadığını kendi verinle görürsün.</p></div>
<div class="row"><button class="btn" data-act="quiz">Teste başla</button><span class="mute">Yaklaşık 2 dakika</span></div>
${matchMedia('(display-mode: standalone)').matches||navigator.standalone?'':'<div class="card"><h3>Uygulama gibi kullan</h3><p class="mute" style="margin:0">iPhone: Safari’de Paylaş → Ana Ekrana Ekle. Android: Chrome menüsü → Ana ekrana ekle. Böylece her gün tek dokunuşla açılır ve ilerlemen kaybolmaz.</p></div>'}
<p class="foot">Eğitim amaçlı bir modeldir, terapi değildir. Verilerin sadece bu cihazda, bu tarayıcıda tutulur.</p>`}

function vQuiz(){
 const q=QZ[U.q],pct=Math.round(U.q/QZ.length*100),a=S.quiz[U.q];
 let h=`<div class="bar"><i style="width:${pct}%"></i></div><p class="mute">Soru ${U.q+1} / ${QZ.length}</p>`;
 if(q.t==='base')h+=`<p class="mute" style="margin:0 0 4px">Son 7 günde…</p><h2>${q.q}</h2>`+LIK.map((l,i)=>`<button class="opt ${a===i?'on':''}" data-act="ans" data-v="${i}">${l}</button>`).join('');
 else{const o=q.t==='time'?TIME:q.o;h+=`<h2>${q.q}</h2>`+o.map((x,i)=>`<button class="opt ${a===i?'on':''}" data-act="ans" data-v="${i}">${x[0]}</button>`).join('')}
 if(U.q>0)h+=`<button class="btn ghost sm" data-act="qback" style="margin-top:6px">Geri</button>`;
 return h}

function meters(vals,max,color){return KEYS.map(k=>`<div class="meter"><span>${TR[k].n}</span><span class="tr"><i style="width:${Math.max(3,vals[k]/max*100)}%;background:${color||TR[k].c}"></i></span><span class="num">${vals[k]}</span></div>`).join('')}

function vResult(){
 const p=S.ord[0],max=Math.max(...Object.values(S.sc),1);
 return `<p class="mute" style="margin:0">Planın hazır</p><h1>Odak alanın: ${TR[p].n}</h1>
<div class="card">${meters(S.sc,max)}<p class="mute" style="margin:10px 0 0">Puanlar testteki cevaplarından hesaplandı. Plan, en yüksek iki alanı iç içe geçirir: iki ders ${TR[p].n.toLowerCase()}, bir ders ${TR[S.ord[1]].n.toLowerCase()}.</p></div>
<div class="card"><h3>${S.plan.length} ders · günde ${S.perDay}</h3><p class="mute" style="margin:0">İlk ölçüm bugün alındı. ${7} gün sonra aynı 5 soruyla tekrar ölçeceğiz.</p></div>
<button class="btn" data-act="start" data-id="${S.plan[0]}">İlk derse başla</button>`}

function lessonCard(id,cta){const l=LB[id],d=S.done[id];return `<div class="card lesson ${d&&!cta?'faded':''}"><span class="dot" style="background:${TR[l.k].c}"></span><div class="grow"><div class="mute">${TR[l.k].n} · 5 dk${d?' · tamamlandı':''}</div><h3>${l.ti}</h3><div class="mute">Araç: ${l.tool}</div></div>${cta?`<button class="btn sm" data-act="start" data-id="${id}">${d?'Tekrar':'Başla'}</button>`:''}</div>`}

function vToday(){
 const t=today(),dt=Object.values(S.done).filter(d=>d.date===t).length;
 const pend=Object.entries(S.done).find(([,d])=>d.date<t&&d.applied==null);
 const next=S.plan.filter(id=>!S.done[id]);
 let h='';
 if(pend){const l=LB[pend[0]];h+=`<div class="card verdict"><p class="mute" style="margin:0">Önceki ders: ${l.tool}</p><h3>Gerçek hayatta uyguladın mı?</h3><div class="chips">${[['Evet',1],['Kısmen',.5],['Hayır',0]].map(x=>`<button class="opt" data-act="applied" data-id="${pend[0]}" data-v="${x[1]}">${x[0]}</button>`).join('')}</div></div>`}
 const ds=daysSince(S.base.date);
 if(ds>=7&&!S.re.some(r=>daysSince(r.date)<7))h+=`<div class="card verdict"><h3>7 gün doldu</h3><p class="mute">Taban ölçümü tekrarlama zamanı. Asıl cevap burada.</p><button class="btn sm" data-act="retest">Tekrar ölç</button></div>`;
 if(!next.length)return h+`<h1>Tüm dersler bitti</h1><p>Şimdi önemli olan sonuç. Ölçüm sekmesine bak.</p><button class="btn" data-act="tab" data-v="measure">Sonuçları gör</button>`;
 h+=`<h1>Bugün</h1><p class="mute">Günlük hedef: ${Math.min(dt,S.perDay)} / ${S.perDay} ders · ölçüm günü: ${Math.max(0,7-ds)} gün sonra</p>`;
 if(dt<S.perDay)h+=next.slice(0,S.perDay-dt).map(id=>lessonCard(id,1)).join('');
 else h+=`<div class="card"><h3>Bugünlük hedef tamam</h3><p class="mute">Bir aracı uygulamak, yeni bir ders okumaktan daha değerli. Yine de istersen devam edebilirsin.</p><button class="btn ghost sm" data-act="start" data-id="${next[0]}">Bir ders daha</button></div>`;
 return h}

function vPlan(){let h='<h1>Planın</h1>';for(let i=0;i<S.plan.length;i+=S.perDay){h+=`<h3 style="margin:22px 0 10px">Gün ${i/S.perDay+1}</h3>`+S.plan.slice(i,i+S.perDay).map(id=>lessonCard(id,S.done[id]||id===S.plan.find(x=>!S.done[x]))).join('')}return h}

function vTools(){const ids=S.plan.filter(id=>S.commits[id]);if(!ids.length)return `<h1>Araçlarım</h1><p class="mute">Her dersin sonunda bir taahhüt kartı oluşur ve buraya eklenir.</p>`;
 return `<h1>Araçlarım</h1><p class="mute">Her ders bıraktığın tek cümle. Kopyalayıp telefonun kilit ekranına ya da takvime koyabilirsin.</p>`+ids.map(id=>`<div class="card"><span class="tag">${LB[id].tool}</span><p style="font-family:Fraunces,serif;font-size:18px;margin:10px 0">${esc(S.commits[id])}</p><button class="btn ghost sm" data-act="copy" data-id="${id}">Kopyala</button></div>`).join('')}

function vMeasure(){
 const d=Object.values(S.done),ap=d.filter(x=>x.applied!=null).map(x=>x.applied);
 const drop=avg(d.map(x=>x.pre-x.post)),rate=ap.length?Math.round(avg(ap)*100):null;
 const last=S.re[S.re.length-1],p=S.ord[0],ds=daysSince(S.base.date);
 let h=`<h1>İşe yarıyor mu?</h1><div class="stats"><div class="card"><b>${d.length}</b><span class="mute">ders</span></div><div class="card"><b>${d.length?(drop>0?'−':'+')+f1(Math.abs(drop)):'–'}</b><span class="mute">ders başı anlık değişim</span></div><div class="card"><b>${rate==null?'–':rate+'%'}</b><span class="mute">uygulama oranı</span></div></div>`;
 h+=`<div class="card"><h3>Taban ölçüm vs. şimdi</h3><p class="mute">Son 7 gün, 0 = hiç, 4 = neredeyse her gün. Düşük olan iyi.</p>`;
 h+=KEYS.map(k=>`<div style="margin:10px 0 4px;font-weight:600;font-size:14px">${TR[k].n}${k===p?' · odak':''}</div><div class="meter"><span class="mute">Başta</span><span class="tr"><i style="width:${Math.max(3,S.base.v[k]/4*100)}%;background:var(--line);outline:1px solid var(--mute)"></i></span><span class="num">${S.base.v[k]}</span></div>${last?`<div class="meter"><span class="mute">Şimdi</span><span class="tr"><i style="width:${Math.max(3,last.v[k]/4*100)}%;background:${TR[k].c}"></i></span><span class="num">${last.v[k]}</span></div>`:''}`).join('');
 h+=`<div class="row" style="margin-top:14px"><button class="btn ${ds>=7?'':'ghost'} sm" data-act="retest">${ds>=7?'Tekrar ölç':'Erken ölç ('+(7-ds)+' gün kaldı)'}</button></div></div>`;
 let v;
 if(!last)v=`Asıl soru 7. günde cevaplanır. Ders sonrası anlık rahatlama gerçek ama geçici bir ruh hali; davranış değişimi değil. Gerçek gösterge, aynı 5 soruya 7 gün sonra verdiğin cevaplar ve araçları ne kadar uyguladığın.`;
 else{const dp=S.base.v[p]-last.v[p];
  if(dp>=1&&(rate??0)>=50)v=`${TR[p].n} puanın ${dp} basamak düştü ve araçların yarısından fazlasını uyguladın. Bu, etkinin derslerden gelmiş olabileceğini düşündürüyor. Yine de tek kişilik, kontrol grubu olmayan bir ölçüm: iyi bir hafta da aynı sonucu verebilir.`;
  else if(dp>=1)v=`${TR[p].n} puanın düştü ama araçları az uyguladın. Değişim büyük ihtimalle başka bir şeyden: daha sakin bir hafta ya da kötü bir haftanın ardından olağan dönüş.`;
  else v=`${TR[p].n} alanında değişim yok. Bu uygulamaların dürüst sınırı bu: dersi okumak tek başına bir şey değiştirmiyor, etki tamamen gerçek hayatta uygulamaya bağlı. ${rate!=null&&rate<50?'Uygulama oranın düşük; önce bir aracı her gün kullanmayı dene.':''}`}
 h+=`<div class="card verdict"><h3>Yorum</h3><p style="margin:0">${v}</p></div>`;
 const sum=summary();
 h+=`<div class="card"><h3>Sonucunu paylaş</h3><p class="mute">Deneme grubundaysan bu özeti gönder; isim ya da yazdığın metinler gitmez, sadece puanlar.</p><div class="row"><button class="btn sm" data-act="share">Özeti kopyala</button><a class="btn ghost sm" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(sum)}">WhatsApp ile gönder</a></div></div>`;
 h+=`<button class="btn ghost sm" data-act="reset" style="margin-top:20px">${U.reset?'Emin misin? Tekrar dokun':'Her şeyi sıfırla'}</button>`;
 return h}

function summary(){const d=Object.values(S.done),ap=d.filter(x=>x.applied!=null).map(x=>x.applied),last=S.re[S.re.length-1];
 const line=k=>`${TR[k].n}: ${S.base.v[k]}${last?' → '+last.v[k]:''}`;
 return [`Beceri Defteri sonucum (${daysSince(S.base.date)}. gün)`,`Odak: ${TR[S.ord[0]].n}`,`Ders: ${d.length}/${S.plan.length}`,`Ders başı anlık değişim: ${d.length?f1(avg(d.map(x=>x.post-x.pre))):'-'}`,`Uygulama oranı: ${ap.length?Math.round(avg(ap)*100)+'%':'-'}`,`Ölçüm (0-4, düşük iyi)${last?' başta → şimdi':''}:`,...KEYS.map(line)].join('\n')}
function vRetest(){const done=BASE.every(b=>U.rt[b[0]]!=null);
 return `<h1>Tekrar ölçüm</h1><p class="mute">Son 7 günü düşün. Başta verdiğin cevaplara bakmadan cevapla.</p>`+BASE.map(b=>`<div class="card"><h3>${b[1]}</h3><div class="chips">${LIK.map((l,i)=>`<button class="opt ${U.rt[b[0]]===i?'on':''}" data-act="rt" data-k="${b[0]}" data-v="${i}">${l}</button>`).join('')}</div></div>`).join('')+`<button class="btn" data-act="rtsave" ${done?'':'disabled'}>Kaydet ve sonucu gör</button>`}

function vLesson(){
 const l=LB[U.lid],n=l.s.length,st=U.st,pct=Math.round((st+1)/(n+1)*100),tn=TR[l.k].n.toLowerCase();
 let h=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="tag" style="box-shadow:inset 4px 0 ${TR[l.k].c}">${l.tool}</span><button class="btn ghost sm" data-act="exit">Kapat</button></div><div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div>`;
 const slider=(v,q)=>`<h2>${q}</h2><div class="big" id="slv">${v}</div><input type="range" class="range" min="0" max="10" value="${v}" id="sl" aria-label="Puan"><div class="scale"><span>0 · hiç</span><span>10 · çok</span></div>`;
 if(st<0)return h+`<p class="mute">Önce bir ölçüm</p>`+slider(U.pre,`Şu an ${tn} seni ne kadar zorluyor?`)+`<div class="row" style="margin-top:20px"><button class="btn" data-act="next">Derse başla</button></div>`;
 if(st===n)return h+`<p class="mute">Ve sonra</p>`+slider(U.post,`Şimdi ${tn} seni ne kadar zorluyor?`)+`<div class="row" style="margin-top:20px"><button class="btn" data-act="finish">Dersi bitir</button></div>`;
 if(st>n){const c=l.s.find(s=>s.t==='commit');return `<h1>Ders tamam</h1><div class="commit">${fill(c.tpl,l.id)}</div><p class="mute" style="margin-top:14px">Puanın ${S.done[l.id].pre} → ${S.done[l.id].post}. Asıl soru yarın: bunu gerçekten uyguladın mı?</p><button class="btn" data-act="tab" data-v="today">Bugüne dön</button>`}
 const s=l.s[st];let ok=true;
 if(s.t==='text')h+=`<h2>${s.h}</h2><p>${fill(s.p,l.id)}</p>`;
 if(s.t==='input')h+=`<h2>${s.h}</h2>${s.p?`<p class="mute">${s.p}</p>`:''}`+s.f.map(([id,lb,ph,ta])=>`<label for="f_${id}">${lb}</label>`+(ta?`<textarea id="f_${id}" data-f="${id}" placeholder="${esc(ph)}">${esc(A(l.id)[id])}</textarea>`:`<input type="text" id="f_${id}" data-f="${id}" placeholder="${esc(ph)}" value="${esc(A(l.id)[id])}">`)).join('');
 if(s.t==='choice'){const cur=A(l.id)[s.id];ok=!!cur;h+=`<h2>${s.h}</h2>`+s.o.map(o=>{const[lb,v]=Array.isArray(o)?o:[o,o];return `<button class="opt ${cur===v?'on':''}" data-act="pick" data-k="${s.id}" data-v="${esc(v)}">${lb}</button>`}).join('')}
 if(s.t==='timer')h+=`<h2>${s.h}</h2><p>${fill(s.p,l.id)}</p><div class="ring" id="ring"><div><div><div class="big" id="tn">${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,'0')}</div><div class="mute" id="tl">hazır</div></div></div></div><div class="row" style="justify-content:center"><button class="btn ghost sm" data-act="tstart" data-v="${s.sec}">Sayacı başlat</button></div>`;
 if(s.t==='breath')h+=`<h2>${s.h}</h2><p>${s.p}</p><div class="orbbox"><div class="orb" id="orb"></div></div><div class="blab" id="blab">&nbsp;</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost sm" data-act="bstart">Başlat</button></div>`;
 if(s.t==='commit')h+=`<h2>Bugünkü aracın</h2><div class="commit">${fill(s.tpl,l.id)}</div><p class="mute" style="margin-top:12px">Bu kart Araçlarım sekmesine kaydedilecek.</p>`;
 h+=`<div class="row" style="margin-top:22px"><button class="btn" data-act="next" ${ok?'':'disabled'}>Devam</button>${st>0?'<button class="btn ghost sm" data-act="back">Geri</button>':''}</div>`;
 return h}

function render(){
 clearT();
 const tabs=[['today','Bugün'],['plan','Plan'],['tools','Araçlarım'],['measure','Ölçüm']];
 const inApp=S.plan.length&&!['quiz','welcome','lesson'].includes(S.view);
 $('#nav').innerHTML=inApp?tabs.map(t=>`<button class="${S.view===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join(''):'';
 const sk=S.plan.length?streak():0;$('#streak').textContent=sk?sk+' gün seri':'';
 const V={welcome:vWelcome,quiz:vQuiz,result:vResult,today:vToday,plan:vPlan,tools:vTools,measure:vMeasure,retest:vRetest,lesson:vLesson}[S.view]||vWelcome;
 $('#app').innerHTML=V();
}
const go=v=>{S.view=v;U.reset=false;save();render();window.scrollTo(0,0)};

function startTimer(sec){const end=Date.now()+sec*1000,r=$('#ring'),tn=$('#tn'),tl=$('#tl');tl.textContent='devam ediyor';
 U.tm=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));tn.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');r.style.setProperty('--p',(100-left/sec*100)+'%');if(!left){clearInterval(U.tm);tl.textContent='süre doldu'}},250)}
function startBreath(){const s=LB[U.lid].s[U.st],orb=$('#orb'),lab=$('#blab');let c=0,i=0;
 const step=()=>{if(c>=s.cyc){lab.textContent='Tamam';orb.style.transform='scale(.6)';return}const[t,sec,sc]=s.ph[i];lab.textContent=t+' · '+(c+1)+'/'+s.cyc;orb.style.transitionDuration=sec+'s';orb.style.transform='scale('+sc+')';i++;if(i>=s.ph.length){i=0;c++}U.bt=setTimeout(step,sec*1000)};step()}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='quiz'){U.q=0;go('quiz')}
 if(a==='ans'){S.quiz[U.q]=+v;if(U.q<QZ.length-1){U.q++;save();render()}else{score();go('result')}}
 if(a==='qback'){U.q--;render()}
 if(a==='tab')go(v);
 if(a==='start'){U.lid=b.dataset.id;U.st=-1;U.pre=5;U.post=5;go('lesson')}
 if(a==='next'){U.st++;save();render();window.scrollTo(0,0)}
 if(a==='back'){U.st--;render()}
 if(a==='exit')go(S.plan.length&&S.base?'today':'welcome');
 if(a==='pick'){A(U.lid)[b.dataset.k]=v;save();render()}
 if(a==='finish'){const l=LB[U.lid],c=l.s.find(s=>s.t==='commit');S.done[l.id]={pre:U.pre,post:U.post,date:today(),applied:S.done[l.id]?.applied??null};S.commits[l.id]=fill(c.tpl,l.id,1);U.st++;save();render();window.scrollTo(0,0)}
 if(a==='tstart'){b.disabled=true;startTimer(+v)}
 if(a==='bstart'){b.disabled=true;startBreath()}
 if(a==='applied'){S.done[b.dataset.id].applied=+v;save();render()}
 if(a==='copy'){const t=S.commits[b.dataset.id];try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Kopyalandı'},()=>{b.textContent='Kopyalanamadı'})}catch(err){b.textContent='Kopyalanamadı'}}
 if(a==='share'){try{navigator.clipboard.writeText(summary()).then(()=>{b.textContent='Kopyalandı'},()=>{b.textContent='Kopyalanamadı'})}catch(err){b.textContent='Kopyalanamadı'}}
 if(a==='retest'){U.rt={};go('retest')}
 if(a==='rt'){U.rt[b.dataset.k]=+v;render()}
 if(a==='rtsave'){S.re.push({date:today(),v:{...U.rt}});go('measure')}
 if(a==='reset'){if(U.reset){S=blank();save();go('welcome')}else{U.reset=true;render()}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.f){A(U.lid)[t.dataset.f]=t.value.trim();save()}
 if(t.id==='sl'){$('#slv').textContent=t.value;if(U.st<0)U.pre=+t.value;else U.post=+t.value}
});
if(S.view==='lesson'||S.view==='quiz'||S.view==='retest')S.view=S.plan.length&&S.base?'today':'welcome';
render();
}
</script>
</body></html>
