<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Double Cross oyun kapağı">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1320"/>
      <stop offset="0.55" stop-color="#2a1418"/>
      <stop offset="1" stop-color="#0c0a10"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.82" cy="0.22" r="0.18">
      <stop offset="0" stop-color="#ffe7b0"/>
      <stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="525" cy="80" r="120" fill="url(#moon)"/>
  <circle cx="525" cy="80" r="26" fill="#ffefc4"/>
  <!-- yıldızlar -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="60" y="40" width="2" height="2"/><rect x="120" y="70" width="2" height="2"/>
    <rect x="200" y="35" width="2" height="2"/><rect x="300" y="60" width="2" height="2"/>
    <rect x="380" y="30" width="2" height="2"/><rect x="440" y="95" width="2" height="2"/>
    <rect x="90" y="110" width="2" height="2"/><rect x="250" y="100" width="2" height="2"/>
  </g>
  <!-- şehir silüeti -->
  <g fill="#15121c">
    <rect x="0" y="200" width="70" height="160"/>
    <rect x="70" y="160" width="55" height="200"/>
    <rect x="125" y="210" width="60" height="150"/>
    <rect x="185" y="140" width="50" height="220"/>
    <rect x="235" y="190" width="65" height="170"/>
    <rect x="300" y="120" width="48" height="240"/>
    <rect x="348" y="205" width="58" height="155"/>
    <rect x="406" y="165" width="52" height="195"/>
    <rect x="458" y="225" width="70" height="135"/>
    <rect x="528" y="150" width="52" height="210"/>
    <rect x="580" y="200" width="60" height="160"/>
  </g>
  <!-- aydınlık pencereler -->
  <g fill="#ffb347" opacity="0.85">
    <rect x="86" y="180" width="6" height="8"/><rect x="100" y="200" width="6" height="8"/>
    <rect x="198" y="165" width="6" height="8"/><rect x="212" y="190" width="6" height="8"/>
    <rect x="312" y="150" width="6" height="8"/><rect x="326" y="180" width="6" height="8"/>
    <rect x="420" y="190" width="6" height="8"/><rect x="540" y="175" width="6" height="8"/>
    <rect x="554" y="205" width="6" height="8"/>
  </g>
  <!-- yol -->
  <rect x="0" y="330" width="640" height="30" fill="#0a0810"/>
  <rect x="305" y="335" width="30" height="6" fill="#ffd24a"/>
  <rect x="360" y="335" width="30" height="6" fill="#ffd24a" opacity="0.7"/>
  <rect x="250" y="335" width="30" height="6" fill="#ffd24a" opacity="0.7"/>
  <!-- başlık -->
  <text x="320" y="215" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="url(#title)" letter-spacing="2">DOUBLE</text>
  <text x="320" y="278" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="url(#title)" letter-spacing="6">CROSS</text>
  <text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cdd2da" letter-spacing="3">3D OPEN WORLD · TRUST NO ONE</text>
</svg>
