<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Abonelik · TamgaStudio</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f0c;color:#d8e6dc;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:0 20px}
  main{max-width:460px;text-align:center}
  h1{font-size:19px;font-weight:600;margin:0 0 8px}
  p{margin:6px 0;color:#9fb3a6}
  a{color:#7fe0a0}
</style>
</head>
<body>
<main>
  <h1 id="t">Abonelik sayfanız açılıyor…</h1>
  <p id="e">Opening your subscription page…</p>
  <p id="m" hidden>Bağlantı eksik görünüyor. Lütfen e-postadaki bağlantıyı tam olarak açın ya da <a href="mailto:ceo@bionests.com">ceo@bionests.com</a> adresine yazın.<br>The link looks incomplete. Please open the full link from the email or write to <a href="mailto:ceo@bionests.com">ceo@bionests.com</a>.</p>
</main>
<script>
  (function () {
    var SUNUCU = 'https://tamga-odeme.ceo-c7e.workers.dev/abonelik';
    var k = new URLSearchParams(location.search).get('k');
    if (k && /^[A-Za-z0-9]{1,40}\.[A-Za-z0-9_-]{12}$/.test(k)) {
      location.replace(SUNUCU + '?k=' + encodeURIComponent(k));
    } else {
      document.getElementById('t').hidden = true;
      document.getElementById('e').hidden = true;
      document.getElementById('m').hidden = false;
    }
  })();
</script>
</body>
</html>
