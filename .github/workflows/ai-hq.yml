# CI for the standalone AI HQ app in ai-hq/. Runs only when ai-hq/ (or this
# file) changes and never touches the rest of the repository.
name: AI HQ

on:
  push:
    branches: [main]
    paths: ["ai-hq/**", ".github/workflows/ai-hq.yml"]
  pull_request:
    paths: ["ai-hq/**", ".github/workflows/ai-hq.yml"]

permissions:
  contents: read

concurrency:
  group: ai-hq-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-hq

jobs:
  checks:
    name: Lint, types, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-hq/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit, component and database tests (PGlite)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Against the in-repo Supabase emulator: no credentials, no external services.
      - name: End-to-end tests
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: "1"

      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ai-hq/test-results
          retention-days: 7
